<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gece Rafı — Sesli Kitaplarım</title>
<meta name="theme-color" content="#14131F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gece Rafı">
<style>
  :root{
    --bg:#14131F;
    --surface:#1E1D2E;
    --surface-2:#26243A;
    --ink:#F2EFE9;
    --muted:#8B879C;
    --lamp:#E8A94C;
    --lamp-dim:#8A6A34;
    --thread:#C0554A;
    --line:#332F49;
    --radius:18px;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @font-face{
    font-family:"Fraunces";
    src: local("Georgia");
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(120% 90% at 50% -10%, #201f30 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:var(--body);
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior:none;
  }
  #app{max-width:560px; margin:0 auto; padding:0 20px 40px;}

  /* ---------- Top bar ---------- */
  header.topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:28px 4px 18px;
  }
  header.topbar h1{
    font-family:var(--display); font-weight:600; font-size:28px; margin:0;
    letter-spacing:0.2px;
  }
  header.topbar span.eyebrow{
    display:block; font-family:var(--mono); font-size:11px; letter-spacing:2px;
    color:var(--lamp); text-transform:uppercase; margin-bottom:6px;
  }
  button.icon-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:44px; height:44px; border-radius:50%; font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  button.icon-btn:active{transform:scale(0.94);}

  /* ---------- Library grid ---------- */
  #library{display:flex; flex-direction:column; gap:14px; margin-top:6px;}
  .empty-state{
    text-align:center; padding:70px 20px; color:var(--muted);
  }
  .empty-state .lamp-glow{
    width:64px; height:64px; margin:0 auto 18px; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, var(--lamp), var(--lamp-dim) 70%, transparent 72%);
    box-shadow:0 0 40px 6px rgba(232,169,76,0.25);
  }
  .empty-state p{font-size:15px; line-height:1.6; margin:0 0 22px;}

  .book-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; cursor:pointer;
    position:relative; overflow:hidden;
  }
  .book-card:active{background:var(--surface-2);}
  .spine{
    width:46px; height:64px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:600; font-size:18px; color:#14131F;
  }
  .book-meta{flex:1; min-width:0;}
  .book-meta .title{
    font-family:var(--display); font-size:17px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .book-meta .author{color:var(--muted); font-size:13px; margin-top:2px;}
  .book-meta .prog-row{
    display:flex; align-items:center; gap:8px; margin-top:10px;
  }
  .prog-track{
    flex:1; height:3px; background:var(--line); border-radius:3px; overflow:hidden;
  }
  .prog-fill{height:100%; background:var(--lamp);}
  .prog-label{font-family:var(--mono); font-size:10px; color:var(--muted); white-space:nowrap;}
  .book-card .del-btn{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    font-size:13px; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Add book fab ---------- */
  .fab{
    position:fixed; right:24px; bottom:calc(24px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; border:none;
    background:var(--lamp); color:#14131F; font-size:28px; font-weight:400;
    box-shadow:0 8px 24px rgba(232,169,76,0.35); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:20;
  }
  .fab:active{transform:scale(0.94);}

  /* ---------- Modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(10,10,16,0.6);
    display:none; align-items:flex-end; z-index:30;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--surface); width:100%; border-radius:22px 22px 0 0;
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .sheet h2{font-family:var(--display); font-size:21px; margin:0 0 18px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-family:var(--mono); font-size:11px; letter-spacing:1px;
    text-transform:uppercase; color:var(--muted); margin-bottom:7px;
  }
  .field input[type=text]{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--ink); border-radius:12px; padding:12px 14px; font-size:15px;
    font-family:var(--body);
  }
  .file-drop{
    border:1.5px dashed var(--line); border-radius:14px; padding:22px 14px;
    text-align:center; color:var(--muted); font-size:13.5px; cursor:pointer;
  }
  .file-drop.has-files{border-color:var(--lamp); color:var(--ink);}
  .file-list{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .file-list .frow{
    display:flex; justify-content:space-between; gap:10px; font-size:13px;
    background:var(--surface-2); padding:8px 10px; border-radius:8px;
  }
  .file-list .frow span.fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .btn-row{display:flex; gap:10px; margin-top:8px;}
  button.primary{
    flex:1; background:var(--lamp); color:#14131F; border:none;
    border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button.ghost{
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:12px; padding:14px 18px; font-size:15px; cursor:pointer;
  }
  button.primary:disabled{opacity:0.4;}

  /* ---------- Player ---------- */
  #playerView{display:none;}
  #playerView.open{display:block;}
  #libraryView.hidden{display:none;}

  .player-top{display:flex; align-items:center; justify-content:space-between; padding:22px 4px 6px;}
  .player-book-title{font-family:var(--display); font-size:15px; color:var(--muted); text-align:center; flex:1; padding:0 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .lamp-stage{
    margin:26px auto 8px; width:220px; height:220px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .lamp-glow-ring{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, rgba(232,169,76,0.35) 0%, rgba(232,169,76,0.06) 55%, transparent 70%);
    transition:opacity 0.4s ease;
  }
  .lamp-glow-ring.playing{animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{transform:scale(1); opacity:0.9;}
    50%{transform:scale(1.08); opacity:1;}
  }
  .lamp-core{
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #f4c983, var(--lamp) 55%, var(--lamp-dim) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 50px 10px rgba(232,169,76,0.2), inset 0 -10px 30px rgba(0,0,0,0.15);
  }
  .lamp-core button{
    width:64px; height:64px; border-radius:50%; border:none; background:rgba(20,19,31,0.88);
    color:var(--lamp); font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .chapter-name{text-align:center; font-family:var(--display); font-size:19px; font-weight:600; margin-top:10px;}
  .chapter-index{text-align:center; font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-top:4px;}

  .scrub-wrap{padding:26px 4px 4px;}
  input[type=range]{
    -webkit-appearance:none; width:100%; height:4px; border-radius:4px;
    background:var(--line); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--lamp); cursor:pointer; margin-top:-5px;
    box-shadow:0 0 0 4px rgba(232,169,76,0.15);
  }
  .time-row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:6px;}

  .transport{display:flex; align-items:center; justify-content:center; gap:26px; margin-top:22px;}
  .transport button{
    background:none; border:none; color:var(--ink); font-size:15px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .transport button.big{font-size:30px;}
  .transport button span{font-family:var(--mono); font-size:9px; color:var(--muted);}

  .speed-row{display:flex; justify-content:center; gap:8px; margin-top:26px; flex-wrap:wrap;}
  .speed-chip{
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    font-family:var(--mono); font-size:12px; padding:7px 12px; border-radius:20px; cursor:pointer;
  }
  .speed-chip.active{background:var(--lamp); color:#14131F; border-color:var(--lamp);}

  .chapters-panel{margin-top:34px; border-top:1px solid var(--line); padding-top:16px;}
  .chapters-panel h3{
    font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--muted); margin:0 0 12px;
  }
  .chapter-row{
    display:flex; align-items:center; gap:12px; padding:11px 8px; border-radius:10px; cursor:pointer;
  }
  .chapter-row.active{background:var(--surface);}
  .chapter-row .cnum{font-family:var(--mono); font-size:12px; color:var(--muted); width:22px;}
  .chapter-row .cname{flex:1; font-size:14px;}
  .chapter-row.active .cname{color:var(--lamp);}
  .chapter-row .cdur{font-family:var(--mono); font-size:11px; color:var(--muted);}

  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    padding:10px 18px; border-radius:20px; font-size:13px; z-index:50;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== LIBRARY VIEW ===== -->
  <div id="libraryView">
    <header class="topbar">
      <div>
        <span class="eyebrow">Gece Rafı</span>
        <h1>Sesli Kitaplarım</h1>
      </div>
    </header>
    <div id="library"></div>
  </div>

  <!-- ===== PLAYER VIEW ===== -->
  <div id="playerView">
    <div class="player-top">
      <button class="icon-btn" id="backBtn">‹</button>
      <div class="player-book-title" id="playerBookTitle"></div>
      <button class="icon-btn" id="deleteFromPlayerBtn">⋯</button>
    </div>

    <div class="lamp-stage">
      <div class="lamp-glow-ring" id="glowRing"></div>
      <div class="lamp-core">
        <button id="playPauseBtn">▶</button>
      </div>
    </div>
    <div class="chapter-name" id="chapterName">—</div>
    <div class="chapter-index" id="chapterIndex">—</div>

    <div class="scrub-wrap">
      <input type="range" id="scrub" min="0" max="100" value="0" step="0.1">
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="remTime">-0:00</span>
      </div>
    </div>

    <div class="transport">
      <button id="prevChBtn">⏮<span>Önceki</span></button>
      <button class="big" id="back15Btn">↺15</button>
      <button class="big" id="fwd30Btn">30↻</button>
      <button id="nextChBtn">⏭<span>Sonraki</span></button>
    </div>

    <div class="speed-row" id="speedRow"></div>

    <div class="chapters-panel">
      <h3>Bölümler</h3>
      <div id="chapterList"></div>
    </div>
  </div>

</div>

<button class="fab" id="addBookFab">+</button>

<!-- ===== ADD BOOK SHEET ===== -->
<div class="sheet-backdrop" id="addSheetBackdrop">
  <div class="sheet">
    <h2>Yeni Kitap Ekle</h2>
    <div class="field">
      <label>Kitap Adı</label>
      <input type="text" id="newTitle" placeholder="Örn. Şeker Portakalı">
    </div>
    <div class="field">
      <label>Yazar / Seslendiren (opsiyonel)</label>
      <input type="text" id="newAuthor" placeholder="Örn. Ben">
    </div>
    <div class="field">
      <label>Ses Dosyaları (bölümler)</label>
      <div class="file-drop" id="fileDrop">Dokun ve dosya seç — birden fazla dosya seçersen her biri bir bölüm olur</div>
      <input type="file" id="fileInput" accept="audio/*" multiple style="display:none;">
      <div class="file-list" id="fileList"></div>
    </div>
    <div class="btn-row">
      <button class="ghost" id="cancelAddBtn">Vazgeç</button>
      <button class="primary" id="saveBookBtn" disabled>Kaydet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- IndexedDB ---------------- */
  const DB_NAME = "geceRafiDB";
  const DB_VERSION = 1;
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const _db = e.target.result;
        if(!_db.objectStoreNames.contains("books")){
          _db.createObjectStore("books", {keyPath:"id"});
        }
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = (e) => reject(e);
    });
  }

  function tx(storeName, mode){
    return db.transaction(storeName, mode).objectStore(storeName);
  }

  function dbGetAll(){
    return new Promise((resolve, reject) => {
      const req = tx("books","readonly").getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e);
    });
  }

  function dbPut(book){
    return new Promise((resolve, reject) => {
      const req = tx("books","readwrite").put(book);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e);
    });
  }

  function dbDelete(id){
    return new Promise((resolve, reject) => {
      const req = tx("books","readwrite").delete(id);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e);
    });
  }

  /* ---------------- State ---------------- */
  let books = [];
  let pendingFiles = [];
  let currentBook = null;
  let currentChapterIdx = 0;
  let audio = new Audio();
  let speeds = [0.75, 1, 1.25, 1.5, 2];
  let currentSpeed = 1;
  let objectUrl = null;

  const spineColors = ["#E8A94C", "#C0554A", "#6E9887", "#7A8CC4", "#B98BC9", "#D6A6D9"];

  /* ---------------- Helpers ---------------- */
  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ":" + String(s).padStart(2,"0");
  }

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1800);
  }

  function initials(title){
    return (title||"?").trim().slice(0,2).toUpperCase();
  }

  /* ---------------- Library rendering ---------------- */
  function renderLibrary(){
    const el = document.getElementById("library");
    el.innerHTML = "";
    if(books.length === 0){
      el.innerHTML = `
        <div class="empty-state">
          <div class="lamp-glow"></div>
          <p>Henüz kitap yok.<br>Sağ alttaki + düğmesiyle kendi seslendirmelerini ekleyerek rafını doldur.</p>
        </div>`;
      return;
    }
    books.forEach((book, i) => {
      const totalDur = book.chapters.reduce((a,c)=>a+(c.duration||0),0);
      const doneDur = book.chapters.reduce((a,c,idx)=>{
        if(idx < book.progress.chapterIndex) return a + (c.duration||0);
        if(idx === book.progress.chapterIndex) return a + (book.progress.time||0);
        return a;
      },0);
      const pct = totalDur ? Math.min(100, (doneDur/totalDur)*100) : 0;
      const card = document.createElement("div");
      card.className = "book-card";
      card.innerHTML = `
        <div class="spine" style="background:${spineColors[i % spineColors.length]}">${initials(book.title)}</div>
        <div class="book-meta">
          <div class="title">${escapeHtml(book.title)}</div>
          <div class="author">${escapeHtml(book.author || book.chapters.length + " bölüm")}</div>
          <div class="prog-row">
            <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
            <div class="prog-label">${Math.round(pct)}%</div>
          </div>
        </div>
        <button class="del-btn" data-id="${book.id}">✕</button>
      `;
      card.addEventListener("click", (e) => {
        if(e.target.closest(".del-btn")) return;
        openPlayer(book.id);
      });
      card.querySelector(".del-btn").addEventListener("click", async (e) => {
        e.stopPropagation();
        if(confirm(`"${book.title}" silinsin mi? Bu işlem geri alınamaz.`)){
          await dbDelete(book.id);
          books = books.filter(b => b.id !== book.id);
          renderLibrary();
          toast("Kitap silindi");
        }
      });
      el.appendChild(card);
    });
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  /* ---------------- Add book flow ---------------- */
  const addSheetBackdrop = document.getElementById("addSheetBackdrop");
  document.getElementById("addBookFab").addEventListener("click", () => {
    pendingFiles = [];
    document.getElementById("newTitle").value = "";
    document.getElementById("newAuthor").value = "";
    document.getElementById("fileList").innerHTML = "";
    document.getElementById("fileDrop").classList.remove("has-files");
    document.getElementById("fileDrop").textContent = "Dokun ve dosya seç — birden fazla dosya seçersen her biri bir bölüm olur";
    updateSaveEnabled();
    addSheetBackdrop.classList.add("open");
  });
  document.getElementById("cancelAddBtn").addEventListener("click", () => {
    addSheetBackdrop.classList.remove("open");
  });
  addSheetBackdrop.addEventListener("click", (e) => {
    if(e.target === addSheetBackdrop) addSheetBackdrop.classList.remove("open");
  });

  document.getElementById("fileDrop").addEventListener("click", () => {
    document.getElementById("fileInput").click();
  });
  document.getElementById("fileInput").addEventListener("change", (e) => {
    pendingFiles = Array.from(e.target.files);
    renderFileList();
  });

  function renderFileList(){
    const drop = document.getElementById("fileDrop");
    const list = document.getElementById("fileList");
    if(pendingFiles.length){
      drop.classList.add("has-files");
      drop.textContent = pendingFiles.length + " dosya seçildi — değiştirmek için tekrar dokun";
    } else {
      drop.classList.remove("has-files");
      drop.textContent = "Dokun ve dosya seç — birden fazla dosya seçersen her biri bir bölüm olur";
    }
    list.innerHTML = pendingFiles.map(f => `<div class="frow"><span class="fname">${escapeHtml(f.name)}</span></div>`).join("");
    updateSaveEnabled();
  }

  function updateSaveEnabled(){
    const title = document.getElementById("newTitle").value.trim();
    document.getElementById("saveBookBtn").disabled = !(title && pendingFiles.length);
  }
  document.getElementById("newTitle").addEventListener("input", updateSaveEnabled);

  function readFileAsArrayBuffer(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsArrayBuffer(file);
    });
  }

  function getAudioDuration(blob){
    return new Promise((resolve) => {
      const tempUrl = URL.createObjectURL(blob);
      const a = new Audio();
      a.preload = "metadata";
      a.onloadedmetadata = () => {
        resolve(a.duration || 0);
        URL.revokeObjectURL(tempUrl);
      };
      a.onerror = () => { resolve(0); URL.revokeObjectURL(tempUrl); };
      a.src = tempUrl;
    });
  }

  document.getElementById("saveBookBtn").addEventListener("click", async () => {
    const title = document.getElementById("newTitle").value.trim();
    const author = document.getElementById("newAuthor").value.trim();
    if(!title || !pendingFiles.length) return;

    const btn = document.getElementById("saveBookBtn");
    btn.disabled = true;
    btn.textContent = "Kaydediliyor…";

    const chapters = [];
    for(const file of pendingFiles.sort((a,b)=>a.name.localeCompare(b.name, "tr"))){
      const buf = await readFileAsArrayBuffer(file);
      const blob = new Blob([buf], {type: file.type || "audio/mpeg"});
      const duration = await getAudioDuration(blob);
      chapters.push({
        name: file.name.replace(/\.[^/.]+$/, ""),
        blob,
        duration
      });
    }

    const book = {
      id: "b_" + Date.now() + "_" + Math.random().toString(36).slice(2,8),
      title, author,
      chapters,
      progress: {chapterIndex:0, time:0},
      createdAt: Date.now()
    };

    await dbPut(book);
    books.unshift(book);
    renderLibrary();
    addSheetBackdrop.classList.remove("open");
    btn.disabled = false;
    btn.textContent = "Kaydet";
    toast("\"" + title + "\" rafa eklendi");
  });

  /* ---------------- Player ---------------- */
  const libraryView = document.getElementById("libraryView");
  const playerView = document.getElementById("playerView");
  const fab = document.getElementById("addBookFab");

  function openPlayer(bookId){
    currentBook = books.find(b => b.id === bookId);
    if(!currentBook) return;
    currentChapterIdx = currentBook.progress.chapterIndex || 0;
    libraryView.classList.add("hidden");
    playerView.classList.add("open");
    fab.style.display = "none";
    document.getElementById("playerBookTitle").textContent = currentBook.title;
    loadChapter(currentChapterIdx, currentBook.progress.time || 0, false);
    renderSpeedRow();
    renderChapterList();
  }

  function closePlayer(){
    audio.pause();
    saveProgress();
    playerView.classList.remove("open");
    libraryView.classList.remove("hidden");
    fab.style.display = "flex";
    renderLibrary();
  }
  document.getElementById("backBtn").addEventListener("click", closePlayer);

  document.getElementById("deleteFromPlayerBtn").addEventListener("click", async () => {
    if(!currentBook) return;
    if(confirm(`"${currentBook.title}" silinsin mi?`)){
      const id = currentBook.id;
      audio.pause();
      await dbDelete(id);
      books = books.filter(b => b.id !== id);
      closePlayer();
      toast("Kitap silindi");
    }
  });

  function loadChapter(idx, startTime, autoplay){
    if(!currentBook || !currentBook.chapters[idx]) return;
    currentChapterIdx = idx;
    const ch = currentBook.chapters[idx];
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(ch.blob);
    audio.src = objectUrl;
    audio.playbackRate = currentSpeed;
    audio.currentTime = startTime || 0;
    document.getElementById("chapterName").textContent = ch.name;
    document.getElementById("chapterIndex").textContent = "Bölüm " + (idx+1) + " / " + currentBook.chapters.length;
    if(autoplay){
      audio.play().catch(()=>{});
    }
    updatePlayPauseIcon();
    renderChapterList();
  }

  function updatePlayPauseIcon(){
    const playing = !audio.paused && !audio.ended;
    document.getElementById("playPauseBtn").textContent = playing ? "❚❚" : "▶";
    document.getElementById("glowRing").classList.toggle("playing", playing);
  }

  document.getElementById("playPauseBtn").addEventListener("click", () => {
    if(audio.paused){ audio.play().catch(()=>{}); }
    else { audio.pause(); }
  });
  audio.addEventListener("play", updatePlayPauseIcon);
  audio.addEventListener("pause", updatePlayPauseIcon);

  document.getElementById("back15Btn").addEventListener("click", () => {
    audio.currentTime = Math.max(0, audio.currentTime - 15);
  });
  document.getElementById("fwd30Btn").addEventListener("click", () => {
    audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 30);
  });
  document.getElementById("prevChBtn").addEventListener("click", () => {
    if(currentChapterIdx > 0){ saveProgress(); loadChapter(currentChapterIdx - 1, 0, !audio.paused); }
  });
  document.getElementById("nextChBtn").addEventListener("click", () => {
    goToNextChapter();
  });

  function goToNextChapter(){
    if(currentBook && currentChapterIdx < currentBook.chapters.length - 1){
      const wasPlaying = !audio.paused;
      saveProgress();
      loadChapter(currentChapterIdx + 1, 0, wasPlaying);
    } else {
      saveProgress();
      toast("Kitabın sonuna geldin");
    }
  }
  audio.addEventListener("ended", goToNextChapter);

  const scrub = document.getElementById("scrub");
  let scrubbing = false;
  scrub.addEventListener("input", () => { scrubbing = true; });
  scrub.addEventListener("change", () => {
    audio.currentTime = (scrub.value/100) * (audio.duration || 0);
    scrubbing = false;
  });
  audio.addEventListener("timeupdate", () => {
    if(!scrubbing && audio.duration){
      scrub.value = (audio.currentTime/audio.duration)*100;
    }
    document.getElementById("curTime").textContent = fmtTime(audio.currentTime);
    document.getElementById("remTime").textContent = "-" + fmtTime((audio.duration||0) - audio.currentTime);
  });

  function renderSpeedRow(){
    const row = document.getElementById("speedRow");
    row.innerHTML = "";
    speeds.forEach(s => {
      const chip = document.createElement("button");
      chip.className = "speed-chip" + (s === currentSpeed ? " active" : "");
      chip.textContent = s + "×";
      chip.addEventListener("click", () => {
        currentSpeed = s;
        audio.playbackRate = s;
        renderSpeedRow();
      });
      row.appendChild(chip);
    });
  }

  function renderChapterList(){
    const list = document.getElementById("chapterList");
    if(!currentBook) return;
    list.innerHTML = "";
    currentBook.chapters.forEach((ch, idx) => {
      const row = document.createElement("div");
      row.className = "chapter-row" + (idx === currentChapterIdx ? " active" : "");
      row.innerHTML = `
        <div class="cnum">${idx+1}</div>
        <div class="cname">${escapeHtml(ch.name)}</div>
        <div class="cdur">${fmtTime(ch.duration)}</div>
      `;
      row.addEventListener("click", () => {
        const wasPlaying = !audio.paused;
        saveProgress();
        loadChapter(idx, 0, wasPlaying);
      });
      list.appendChild(row);
    });
  }

  function saveProgress(){
    if(!currentBook) return;
    currentBook.progress = {chapterIndex: currentChapterIdx, time: audio.currentTime || 0};
    dbPut(currentBook).catch(()=>{});
  }
  setInterval(() => { if(playerView.classList.contains("open")) saveProgress(); }, 5000);
  window.addEventListener("beforeunload", saveProgress);
  document.addEventListener("visibilitychange", () => { if(document.hidden) saveProgress(); });

  /* ---------------- Boot ---------------- */
  async function boot(){
    await openDB();
    books = await dbGetAll();
    books.sort((a,b) => b.createdAt - a.createdAt);
    renderLibrary();

    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  }
  boot();
})();
</script>
</body>
</html>
